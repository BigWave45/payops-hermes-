name: Flutterwave v4 OAuth sandbox smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - feat/flutterwave-v4-hermes-oauth
    paths:
      - .github/workflows/flutterwave-v4-smoke.yml
      - payops/providers/flutterwave.py
      - payops/tools.py
      - payops/reconcile.py
      - payops/models.py

permissions:
  contents: read

jobs:
  flutterwave-v4-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PayOps
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Check out Hermes OAuth feature branch
        uses: actions/checkout@v4
        with:
          repository: BigWave45/hermes-agent
          ref: feat/plugin-oauth-client-credentials
          path: hermes-agent

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: hermes-agent/uv.lock

      - name: Install Hermes environment
        working-directory: hermes-agent
        run: uv sync --frozen --no-dev

      - name: Configure isolated Hermes profile and install PayOps
        working-directory: hermes-agent
        env:
          HERMES_HOME: ${{ runner.temp }}/payops-hermes-home
          FLUTTERWAVE_CLIENT_ID: ${{ secrets.FLUTTERWAVE_CLIENT_ID }}
          FLUTTERWAVE_CLIENT_SECRET: ${{ secrets.FLUTTERWAVE_CLIENT_SECRET }}
        run: |
          set -eu
          test -n "$FLUTTERWAVE_CLIENT_ID"
          test -n "$FLUTTERWAVE_CLIENT_SECRET"
          mkdir -p "$HERMES_HOME/plugins/payops"
          cp -R ../payops/. "$HERMES_HOME/plugins/payops/"
          umask 077
          printf 'FLUTTERWAVE_CLIENT_ID=%s\nFLUTTERWAVE_CLIENT_SECRET=%s\n' \
            "$FLUTTERWAVE_CLIENT_ID" "$FLUTTERWAVE_CLIENT_SECRET" > "$HERMES_HOME/.env"
          uv run hermes auth add payops:flutterwave

      - name: Verify read-only Flutterwave v4 charge listing
        working-directory: hermes-agent
        env:
          HERMES_HOME: ${{ runner.temp }}/payops-hermes-home
        run: |
          PYTHONPATH="$HERMES_HOME/plugins" uv run python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from payops.tools import list_transactions

          end = datetime.now(timezone.utc)
          start = end - timedelta(days=14)
          result = json.loads(list_transactions({
              "from_date": start.strftime("%Y-%m-%d"),
              "to_date": end.strftime("%Y-%m-%d"),
              "providers": ["flutterwave"],
              "max_pages": 2,
          }))
          if result.get("provider_errors"):
              raise SystemExit("Flutterwave plugin tool returned provider errors")
          if "transactions" not in result or "count" not in result:
              raise SystemExit("Flutterwave plugin tool returned an invalid response")
          print(
              "Flutterwave v4 sandbox OAuth and PayOps transaction tool succeeded; "
              f"charges={result['count']}; "
              f"pagination_warnings={len(result.get('provider_warnings', []))}"
          )
          for warning in result.get("provider_warnings", []):
              print("pagination warning: " + warning)
          PY
