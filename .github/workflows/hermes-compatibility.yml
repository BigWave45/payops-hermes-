name: Hermes compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native-plugin-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PayOps
        uses: actions/checkout@v4

      - name: Check out pinned Hermes Agent release
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19
          path: hermes-agent

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: hermes-agent/uv.lock

      - name: Install pinned Hermes environment
        working-directory: hermes-agent
        run: uv sync --frozen --no-dev

      - name: Verify Hermes CLI
        working-directory: hermes-agent
        env:
          HERMES_HOME: ${{ runner.temp }}/payops-hermes-home
        run: uv run hermes --version

      - name: Run Hermes plugin discovery and registration checks
        working-directory: hermes-agent
        env:
          HERMES_HOME: ${{ runner.temp }}/payops-hermes-home
        run: uv run hermes plugins doctor ../payops/ --ci

      - name: Run Hermes plugin validation
        working-directory: hermes-agent
        env:
          HERMES_HOME: ${{ runner.temp }}/payops-hermes-home
        run: uv run hermes plugins validate ../payops/ --install-deps
