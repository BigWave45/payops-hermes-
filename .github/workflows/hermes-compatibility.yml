name: Hermes compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native-plugin-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PayOps
        uses: actions/checkout@v4

      - name: Check out pinned Hermes Agent release
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19
          path: hermes-agent

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Hermes Agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./hermes-agent

      - name: Verify Hermes CLI
        env:
          HERMES_HOME: ${{ runner.temp }}/payops-hermes-home
        run: hermes --version

      - name: Run Hermes plugin discovery and registration checks
        env:
          HERMES_HOME: ${{ runner.temp }}/payops-hermes-home
        run: hermes plugins doctor payops/ --ci

      - name: Run Hermes plugin validation
        env:
          HERMES_HOME: ${{ runner.temp }}/payops-hermes-home
        run: hermes plugins validate payops/ --install-deps
