name: CI

on:
  push:
    branches: [main, 'feat/flutterwave-v4-hermes-oauth']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the declared minimum; 3.14 matches the current Hermes runtime.
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest PyYAML
      - name: Compile Python modules
        run: python -m compileall -q payops tests scripts
      - name: Run unit tests
        run: PYTHONPATH=. python -m pytest -q
      - name: Run synthetic reconciliation demonstration
        run: PYTHONPATH=. python examples/demo_reconciliation.py
