name: Paystack live smoke test

on:
  workflow_dispatch:
    inputs:
      providers:
        description: Paystack test credentials to verify
        required: true
        type: choice
        options:
          - paystack
        default: paystack
      paystack_reference:
        description: Optional Paystack test transaction reference to verify
        required: false
        type: string

permissions:
  contents: read

jobs:
  live-provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out PayOps
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Run read-only test-mode provider checks
        env:
          PAYOPS_PROVIDERS: ${{ inputs.providers }}
          PAYSTACK_TEST_SECRET_KEY: ${{ secrets.PAYSTACK_TEST_SECRET_KEY }}
          PAYSTACK_TEST_REFERENCE: ${{ inputs.paystack_reference }}
          FLUTTERWAVE_TEST_SECRET_KEY: ${{ secrets.FLUTTERWAVE_TEST_SECRET_KEY }}
        run: python scripts/live_provider_smoke.py
