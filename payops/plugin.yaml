name: payops
version: "0.1.0"
description: Read-only Paystack and Flutterwave transaction inspection and reconciliation for Hermes agents.
provides_tools:
  - payops_list_transactions
  - payops_reconcile
requires_env:
  - name: PAYSTACK_SECRET_KEY
    description: Paystack API secret key. Use a test key during development.
    url: https://dashboard.paystack.com/#/settings/developer
    secret: true
  - name: FLUTTERWAVE_CLIENT_ID
    description: Flutterwave v4 sandbox OAuth client ID.
    url: https://developers.flutterwave.com/
    secret: true
  - name: FLUTTERWAVE_CLIENT_SECRET
    description: Flutterwave v4 sandbox OAuth client secret.
    url: https://developers.flutterwave.com/
    secret: true
