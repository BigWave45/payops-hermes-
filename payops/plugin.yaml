name: payops
version: "0.2.1"
description: Read-only Paystack transaction inspection and reconciliation for Hermes agents.
requires_hermes: ">=0.23.0"
provides_tools:
  - payops_list_transactions
  - payops_reconcile
requires_env:
  - name: PAYSTACK_SECRET_KEY
    description: Paystack API secret key. Use a test key during development.
    url: https://dashboard.paystack.com/#/settings/developer
    secret: true
